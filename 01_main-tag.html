<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메인 태그</title>
  </head>
  <body>
    <h1>헤드라인</h1>
    <h2>헤드라인 2</h2>
    <h3>헤드라인 3</h3>
    <h4>헤드라인 4</h4>
    <h5>헤드라인 5</h5>
    <h6>헤드라인 6</h6>
    <hr />
    <p>가로 구분선</p>
    <!-- 요새는 html 태그를 어떻게 배우는가 -->
    <!-- AI를 통해서 생성 
  -> 내가 쓰고 싶은 것들은 잘 모름 -->
    <p>
      strong
      <hr />
      <strong>강조</strong>
      <br />
      <em>이텔릭체</em> <br />
      볼드 처리
    </p>
    <!-- <ol>은 list안에 있는 것에 대해서 번호로 가능 -->
    <ol>
        <li>로또사기</li>
    </ol>
    <!-- <ul>은 list안에 있는 것에 대해서 점으로 가능 -->
    <ul>
        <li>세수하기</li>
        <li>주식 가격보기</li>
    </ul>
  </body>
</html>
